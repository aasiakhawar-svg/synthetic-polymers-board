()=>`<div class="card"><h2>1. Addition polymerisation</h2><p><b>Polymerisation</b> is joining lots of small molecules (<span class="mk">monomers</span>) to make one big molecule (the <span class="mk">polymer</span>). In <b>addition</b> polymerisation the monomers (alkenes with C=C) simply add onto each other and nothing else is formed.</p><div id="an">${an(0)}</div><button class="btn" onclick="$('an').innerHTML=an(1)">▶ Polymerise</button><button class="btn alt" onclick="$('an').innerHTML=an(0)">Reset</button>
<div class="key">Conditions: heat, high pressure and an <b>initiator</b> (not a catalyst, because it is used up). Chains are about 4000 to 40 000 carbon atoms long.</div></div>
<div class="card"><h2>Monomer, repeat unit, polymer</h2>${rxn(["H","H","H","H"],2)}<div class="two"><div class="note" style="background:#0a8fd622"><b style="color:var(--pr)">Monomer:</b> ethene, the small molecule with C=C.</div><div class="note" style="background:#f08a2422"><b style="color:var(--or)">Repeat unit:</b> the part in the brackets, with continuation bonds. <b>n</b> = a large number.</div></div></div>`+qc("What happens to the C=C bond during addition polymerisation?",["It breaks to leave a single bond and links to neighbours","It becomes a triple bond","It is unchanged","It forms water"],0,"The double bond opens out; its electrons form the links in the chain."),
()=>`<div class="card"><h2>2. Draw the polymerisation of any alkene</h2><p>Choose a monomer, then press <b>Next step</b>. Change <i>nothing</i> except opening the double bond.</p><div class="chips" id="mc"></div><div class="vis" id="v2"></div><div class="note" id="n2"></div><button class="btn" onclick="nx2()">Next step</button><button class="btn alt" onclick="s2=0;r2()">Reset</button><div class="key" id="u2"></div></div>`+qc("Which monomer makes PVC?",["Ethene","Chloroethene","Tetrafluoroethene","Propene"],1,"Chloroethene, CH₂=CHCl, gives poly(chloroethene), PVC."),
()=>`<div class="card"><h2>3. Work out the monomer from the polymer</h2><p>Example: poly(styrene).</p><div class="vis" id="v3"></div><div class="note" id="n3"></div><button class="btn" onclick="nx3()">Next step</button><button class="btn alt" onclick="ps=0;r3()">Reset</button></div>`+qc("To get the monomer from a repeat unit you…",["delete the continuation bonds and put C=C back","add water","add one extra carbon","remove every hydrogen"],0,"Keep the groups exactly as they are. Only the C–C bond becomes C=C."),
()=>`<div class="card"><h2>4. Disposal of addition polymers</h2><div class="warn"><b>The problem:</b> addition polymers contain strong covalent bonds, so they are <b>inert</b> and <b>non-biodegradable</b>: bacteria cannot break them down.</div><p>Compare the two disposal methods:</p><div class="chips" id="dc"></div><div id="dv"></div></div>`+qc("Which toxic gas is released when PVC is burned?",["Hydrogen chloride (and carbon monoxide)","Oxygen","Nitrogen","Only water vapour"],0,"Burning also makes CO₂, which adds to global warming."),
()=>`<div class="card"><h2>5. Condensation polymerisation: polyesters <small>(Chemistry only)</small></h2><p>Two different monomers join alternately, and a small molecule, <b>water</b>, is lost each time. That is why it is called <b>condensation</b>.</p><div class="vis" id="v5"></div><div class="note" id="n5"></div><button class="btn" onclick="s5=Math.min(2,s5+1);r5()">Next step</button><button class="btn alt" onclick="s5=0;r5()">Reset</button>
<div class="key">The link formed is an <b>ester group</b>, –C(=O)–O–. Example: ethanedioic acid + ethane-1,2-diol gives a polyester + water. It does not matter which monomer gives up the OH or the H.</div></div>
<div class="card"><table><tr><th></th><th>Addition</th><th>Condensation</th></tr><tr><td>Monomers</td><td>One type, with C=C</td><td>Two types (diol + dicarboxylic acid)</td></tr><tr><td>By-product</td><td>None</td><td>Water (H₂O)</td></tr></table><div class="note"><b>Biopolyesters</b> such as poly(lactic acid), PLA, are biodegradable. They are made from lactic acid (from corn starch), CH₃CHOHCOOH, which has –OH and –COOH in one molecule. Uses: biodegradable bags, surgical stitches.</div></div>`+qc("What small molecule is lost when a polyester forms?",["Water","Hydrogen","Carbon dioxide","Ethene"],0,"Each ester link forms with the loss of one H₂O.")];
/* ===== exercise questions ===== */
const Q=[
{t:"Ethene",tx:"Ethene, C₂H₄, is an important molecule used in industry. It is an <i>unsaturated hydrocarbon</i>.",p:[
{q:"a) Explain the terms unsaturated and hydrocarbon.",v:vEth,s:["Ethene’s displayed formula has a C=C double bond.","<b>Unsaturated:</b> contains a <span class=mk>carbon–carbon double bond</span> (C=C), so it can add more atoms.","<b>Hydrocarbon:</b> a compound containing <span class=mk>carbon and hydrogen only</span>."]},
{q:"b) Write a balanced equation for the complete combustion of ethene.",v:bal,s:["Write the unbalanced equation: C₂H₄ + O₂ → CO₂ + H₂O (complete combustion gives CO₂ and H₂O).","Balance C: 2 C on the left, so <b>2</b> CO₂.","Balance H: 4 H on the left, so <b>2</b> H₂O.","Balance O: 4 + 2 = 6 O on the right, so <b>3</b> O₂. <span class=mk>C₂H₄ + 3O₂ → 2CO₂ + 2H₂O</span>"]},
{q:"c) Explain why ethene is considered too valuable to be used as a fuel.",s:["Ethene is a key <span class=mk>raw material (feedstock)</span> for making poly(ethene) and other useful chemicals.","Burning it is a one-way, low-value use: the resource cannot be recovered, and other cheaper fuels (such as other fractions of crude oil) can be burned instead."]}]},
{t:"Propene and poly(propene)",tx:"Propene, C₃H₆, can be polymerised to make poly(propene).",p:[
{q:"a) Explain the term polymerisation.",v:s=>an(s>=1),s:["Many small molecules called <b>monomers</b> (here ethene-like alkenes)…","…join together to make <span class=mk>one very large molecule, the polymer</span>. Press through the steps to see it."]},
{q:"b) Draw a displayed formula for propene.",v:prop,s:["Propene has 3 carbons in a chain: C–C–C.","Add the C=C double bond between carbon 2 and carbon 3 (CH₃CH=CH₂).","Complete every carbon to 4 bonds with H: C1 has 3 H, C2 has 1 H, C3 has 2 H. <span class=mk>All bonds must be drawn</span> in a displayed formula."]},
{q:"c) Draw a diagram of a poly(propene) chain showing three repeat units.",v:chain3,s:["Start with the monomer CH₃–CH=CH₂ drawn with C=C in the middle and CH₃ above.","Open the double bond: <span class=mk>repeat unit 1</span> (2 carbons).","Repeat: <span class=mk>repeat unit 2</span>. CH₃ groups appear on every second carbon.","<span class=mk>Unit 3</span>, with <b>continuation bonds</b> at both ends of the chain."]},
{q:"d) Explain what is meant by the word addition.",v:s=>an(s>=1),s:["In addition polymerisation the monomers just <b>add onto each other</b>.","The C=C opens out to form single bonds that link the molecules.","<span class=mk>Only one product</span> forms: nothing else is made or lost."]},
{q:"e) Write a balanced equation for the polymerisation of styrene, C₆H₅CH=CH₂.",v:s=>rxn(["C₆H₅","H","H","H"],s),s:["Draw styrene with C=C in the middle, C₆H₅ above one carbon (show C₆H₅ as a whole).","Open the double bond: <span class=mk>C=C becomes C–C</span>.","Square brackets, continuation bonds and <b>n</b> on both sides: <span class=mk>n styrene → poly(styrene)</span>. Nothing else changes."]},
{q:"f) Draw the structure of the monomer from which Perspex is made.",v:perspex,s:["Look at the chain given in the question: the pattern repeats every two carbons.","Choose any two adjacent carbons to be the repeat unit. Here: C(H)(H) next to C(CH₃)(COOCH₃).","Delete the continuation bonds and <span class=mk>put the double bond back</span>: CH₂=C(CH₃)COOCH₃. Groups stay the same."]},
{q:"g) Which disposal method do you think is better for plastic bags? Give two reasons. (Pick one.)",o:["Landfill","Incineration"],fb:["✔ Good choice if you give two reasons: it is cheap, and it makes no greenhouse or toxic gases from the plastic. Weakness: it needs large areas of land and waste stays for thousands of years.","✔ Good choice if you give two reasons: it needs little space, and the heat can generate electricity. Weakness: it produces CO₂ and toxic gases and the ash still needs landfill."],s:["Either method gets full marks if your <span class=mk>two reasons support your choice</span>.","Mention one point against the other method for a stronger answer.","Landfill: cheap; no toxic or greenhouse gases made. Incineration: little space; heat energy; but it releases CO₂, CO and HCl."]}]},
{t:"Identify a polyester (Chemistry only)",tx:"A polymer has the structure shown below (blue and red blocks are hydrocarbon chains).<div class='vis'>"+poly3(0)+"</div>",p:[
{q:"a) Identify the type of the polymer.",v:s=>poly3(s?1:0),s:["Look for the repeating –C(=O)–O– link between blue and red blocks.","These are <span class=mk>ester groups</span> (yellow), and there are two different alternating blocks. It is a <span class=mk>condensation polymer: a polyester</span>."]},
{q:"b) Draw the structures of the monomers used to make this polymer.",v:s=>poly3(Math.min(s+1,3)),s:["Find the ester links (yellow).","Cut each ester at the C–O bond (✂).","Reverse the loss of water: add <b>–OH</b> to the C=O end and <b>H</b> to the O end (green).","Monomers: a <span class=mk>dicarboxylic acid</span> HO–C(=O)–[blue]–C(=O)–OH and a <span class=mk>diol</span> HO–[red]–OH."]}]}];
/* ===== engine ===== */
const S={};
const names=["1 Addition","2 Draw polymers","3 Find the monomer","4 Disposal","5 Polyesters","Q1 Ethene","Q2 Propene","Q3 Polyester"];
names.forEach((t,i)=>{const b=document.createElement("button");b.textContent=t;b.onclick=()=>go(i);$("nav").append(b)});
function go(i){[...$("nav").children].forEach((b,j)=>b.classList.toggle("on",i==j));let h="";
if(i<5){h=C[i]()+(i<4?`<button class="btn" onclick="go(${i+1})">Next →</button>`:`<button class="btn" onclick="go(5)">Start the exercises →</button>`)}
else{const e=i-5,q=Q[e];h=`<div class="card"><h2>Question ${e+1}. ${q.t}</h2><div class="note">${q.tx}</div></div>`;
q.p.forEach((p,j)=>{h+=`<div class="card"><b>${p.q}</b>`+(p.o?p.o.map((o,k)=>`<button class="opt" onclick="pick(${e},${j},${k},this)">${o}</button>`).join(""):"")+`<div class="note" id="f${e}_${j}" style="display:none"></div>`+(p.v?`<div class="vis" id="v${e}_${j}">${p.v(0)}</div>`:"")+`<div id="s${e}_${j}"></div><button class="btn" id="b${e}_${j}" onclick="nx(${e},${j})">Show step 1 of ${p.s.length}</button></div>`});
h+=`<button class="btn" onclick="go(${i<7?i+1:0})">${i<7?"Next question →":"Back to start"}</button>`}
$("m").innerHTML=h;if(i==1)r2();if(i==2)r3();if(i==3)r4();if(i==4)r5();window.scrollTo(0,0)}
function pick(e,j,k,b){const p=Q[e].p[j],o=b.parentNode.querySelectorAll(".opt");o.forEach(x=>x.disabled=true);b.classList.add("ok");const f=$("f"+e+"_"+j);f.style.display="block";f.innerHTML=p.fb[k]}
function nx(e,j){const key=e+"_"+j,p=Q[e].p[j],k=S[key]||0;if(k>=p.s.length)return;$("s"+key).insertAdjacentHTML("beforeend",`<div class="step"><span class="n">${k+1}</span><div>${p.s[k]}</div></div>`);if(p.v)$("v"+key).innerHTML=p.v(k);S[key]=k+1;const b=$("b"+key);if(k+1>=p.s.length){b.textContent="Solved ✔";b.disabled=true}else b.textContent=`Show step ${k+2} of ${p.s.length}`}
go(0);
</script></body></html>
